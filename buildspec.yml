version: 0.2
env:
  variables:
    DOCKER_IMAGE: "simple-python-app"
  parameter-store:
    DOCKER_REGISTRY_URL: /simplepythonapp/docker-repository/url
    DOCKER_USERNAME: /simplepythonapp/docker-credential/user
    DOCKER_PASSWORD: /simplepythonapp/docker-credential/password

phases:
  install:
    runtime-versions:
      python: 3.11

  pre_build:
    commands:
      - pip install -r simple-python-app/requirements.txt
  build:
    commands:
      - cd simple-python-app
      - docker build --no-cache -t "$DOCKER_REGISTRY_URL/$DOCKER_USERNAME/$DOCKER_IMAGE" .
      - echo "$DOCKER_PASSWORD" | docker login "$DOCKER_REGISTRY_URL" -u "$DOCKER_USERNAME" --password-stdin
      - docker push "$DOCKER_REGISTRY_URL/$DOCKER_USERNAME/$DOCKER_IMAGE"

  post_build:
    commands:
      - echo "Build successfull"

artifacts:
  files:
    - '**/*'
